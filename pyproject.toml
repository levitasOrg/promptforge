[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptforge-cli"
version = "1.0.1"
description = "Turn vague prompts into structured, token-efficient prompts from your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PromptForge contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13,<14",
    "litellm>=1.40,<2.0",
    "pyperclip>=1.8,<2.0",
    "readchar>=4.0,<5.0",
    "tomli-w>=1.0,<2.0",
]

[project.optional-dependencies]
repo = [
    "graphifyy>=0.1",
]
dev = [
    "pytest>=8,<9",
    "pytest-mock>=3.12,<4.0",
    "pytest-benchmark>=4.0,<5.0",
    "pytest-cov>=5.0,<6.0",
    "respx>=0.21,<0.23",
    "httpx>=0.27,<0.29",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
promptforge = "promptforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/promptforge"]

[tool.hatch.build.targets.wheel.force-include]
"src/promptforge/synthesizer/system_prompt.txt" = "promptforge/synthesizer/system_prompt.txt"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B904", "E501"]  # B904: raise-without-from acceptable in CLI handlers; E501: line length enforced by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "pyperclip", "readchar", "tomli_w"]
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
